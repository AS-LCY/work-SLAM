common:
  run_on_mower: false # true / false, default to: true
  map_directory_on_mower: "/userdata/lds_mower/maps/"
  cpu_id_on_mower: []
  init_module_status: 0 # 0: Module_IDLE, 1: Module_MAPPING,  2: Module_SEC_MAPPING, 3: Module_LOCALIZATION
  time_sync_en: false
  localization_mode: false
  offline_mode: false
  temp_test_offline: true ###########################( true false ), default to "false", if test with offline bag, set to "true"
  fast_mode: false
  just_show_mode: false
  show_rviz: false
  save_log_dir: "/home/"
  log_keep_time: 500
  map_relative_to: 2 # -- 2: 使用绝对路径（recommanded）; --1: 相对路径，相对于 catkin workspace; --0: 相对路径，相对于catkin pkg; # disable---3: 相对路径，相对于 ${HOME};
  # map_directory: "/home/forlinx/ws_flbot/maps/1/3dmap/"
  # map_directory: "/home/pmm/data/2-rslidar/calib/0227-22f/"
  # map_directory: "/home/pmm/data/2-rslidar/calib/0227-ouzh/"
  # map_directory: "/home/pmm/data/2-rslidar/calib/0301-th/"
  # map_directory: "/home/pmm/data/2-rslidar/0402/1-22f"
  # map_directory: "/home/pmm/data/2-rslidar/0402/2-ouzh"
  # map_directory: "/home/pmm/data/2-rslidar/5-五个雷达-3576/0408/2-ouzh_5-2"
  map_directory: "/home/pmm/data/2-rslidar/0411/5-3"
  
  # map_directory: "/home/pmm/data/3-vanjee/0107/3dmap/"
  # map_directory: "/home/pmm/data/rslidar/1024/23f/3dmap"
  sub_topic_ctrl_cmd: "/flbot/localization_module/ctrl_cmd"
  pub_topic_module_status: "/flbot/localization_module/module_status"
  pub_topic_module_health: "/flbot/localization_module/module_health"
  pub_topic_module_loginfo: "/flbot/localization_module/log_info"
  pub_topic_slipping: "/flbot/localization_module/slipping"
  receive_lidar_freq: 10 # unit: hz
  slam_lose_rate_time_thr: 0.1 # unit: second
  lidar_no_point_count_thr:  10
  check_delay: false
  feats_down_size_thr: 100
  use_pose_filter: false 
  cpu_id: []
  # cpu_id: [4, 5]

extrinsic:    
  extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0.00425, 0.00418, -0.00446 ] # lidar in imu
  # extrinsic_T: [ 0.004052, 0.004337, -0.004494 ]  # imu in lidar
  # extrinsic_R: [ 0, 0, 0]  # unit(degree), yaw, pitch, roll  
  extrinsic_R: [0.0, 0.0, 0.0]  # unit(degree), yaw, pitch, roll  
       
