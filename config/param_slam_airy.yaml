  # extrinsic_euler_IMU_in_baselink: [-1.769328, 14.696139, -0.537434] # imu in lidar  # unit(degree) yaw, pitch, roll    # airy

  # extrinsic_euler_IMU_in_lidar: [-89.81716115535444, 0.2365335545965223, 179.7041440847162] # unit(degree) yaw, pitch, roll  # airy-v3
  # extrinsic_euler_IMU_in_lidar: [-91.68546653377834, -1.010366382353748, -179.4784633670619] # unit(degree) yaw, pitch, roll  # airy-v4-2025-0226
  # extrinsic_euler_IMU_in_lidar: [-88.199227, -0.332534, 179.751635] # unit(degree) yaw, pitch, roll  # airy-v2
  # extrinsic_euler_IMU_in_lidar: [-0.7059076, 0.7082608, -0.0009345, -0.0077585]  # airy: 5-1 # quaterion: qx, qy, qz, qw  # airy: 5-1
  # extrinsic_euler_IMU_in_lidar: [-0.6991326, 0.7149883, -0.0021260, -0.0008865]  # airy: 5-2 # quaterion: qx, qy, qz, qw  # airy: 5-1
  extrinsic_euler_IMU_in_lidar: [-0.7059780, 0.7081977, -0.0021492, -0.0068142]  # airy: 5-3 # quaterion: qx, qy, qz, qw  # airy: 5-1
  
  
  # extrinsic_euler_lidar_in_baselink: [0.0, 0.0, 0.0] # unit(degree) yaw, pitch, roll
  # extrinsic_euler_lidar_in_baselink: [-88.250826, 1.131189, -5.863650] # unit(degree) yaw, pitch, roll
  extrinsic_euler_lidar_in_baselink: [-90.0, 0.0, -5.0] # unit(degree) yaw, pitch, roll

     

  Lidar_In_Wheel: [1,  0,  0,  0.210,
                    0,  1,  0,  -0.01,
                    0,  0,  1,  0.1,
                    0,  0,  0,  1]

localization:
  fgicp_peroid_sec: 5 # 时间周期，单位： 秒
  # fgicp_score_thr: 0.3 # 0.1
  fgicp_score_fail_thr: 0.3
  fgicp_score_low_accuracy_thr: 0.1
  fgicp_fail_count_thr: 15
  fgicp_low_accuracy_count_thr: 180
  # pose filter
  filter_method: 1 # 0-一阶滤波 # 1-窗口滤波
  fst_order_k: 0.7
  odom2map_delta_thr: 0.05 # 0.05 # double: m
  odom2map_delta_set: 0.01 # 0.01 # double: m
  lidar_ratio: 0.2 
  baselink_dy_thr: 0.02
  baselink_dx_thr: 0.04
  baselink_dyaw_thr: 0.5 # unit: degree
  window_size: 2 
  filter_freq: 100
  using_turning_proc: true
  chassis_linear_velocity_thr: 0.02
  motionless_chassis_ratio: 0.98
  lidar_cbk_delay_thr: 2 # 

lidar_preproc:
  lidar_type: 2 # 1: livox-mid360  # 2: robosense-Airy  # 
  sub_lidar_topic: "/robosense/lidar"
  sub_imu_topic: "/robosense/imu"
  #######################################################
  extract_cloud_method: 0 ## (当前可选0,1,2) #-0:间隔采样 #-1: voxel #-2: 间隔采样&voxel  #-3: feature, 效果不佳  
  ### extract by ring_feature: vanjee & rs
  cloud_column_count: 900
  cloud_ring_count: 48
  edge_curvature_thr: 1.0
  surf_curvature_thr: 0.1
  surf_leafsize: 0.4  # default: 0.4 - outdoor, 0.2 - indoor
  ### extract by line_feature: livox
  line_count: 4 # 此参数在提取特征点（mid360）时用上，其余没有
  #######################################################
  blind_distance: 2
  max_distance: 60
  keep_lidar_num_before_curr: 1 #  取值 >= 0, 0 表示只保留最后一帧， 1 表示可多缓存一帧； 其余的当算不过来时则跳过
  # point_filter_distance: [40, 40, 15] # unit: m; if(abs(point_x)>50 || abs(point_y)>50) then ignore;
  cloud_size_to_keep: 3000
  # feature_enabled: false  # default to false
  point_filter_num: 2 # 间隔采样所需参数
  ring_filter_num: 1
  leafsize: 0.3 # extract_cloud_method == 2 时, voxel 参数 
  leafsize_vec: [0.2, 0.8] # voxel 所需参数
  voxel_region_xyz: [-10, 10.0, -10.0, 10.0, -1, 15]  # order: xmin, xmax, ymin, ymax, zmin, zmax
  boundary_z: 3 # init: m
  # 
  # obstacle_max_range:  2.5
  # obstacle_max_height: 0.5
  # obstacle_min_height: -0.1 # above wheel center
  # obstacle_filter_size: 20
  grid_size: 0.05 # unit: m
  time_cost_thr_print: 10 # unit: ms

mapping:
  acc_cov: 0.1 # 用于IMU_Processing
  gyr_cov: 0.1 # 同上
  b_acc_cov: 0.0001 # 同上
  b_gyr_cov: 0.0001 # 同上  
  cloud_leaf_size: 0.5
  key_frame_distance: 1.0   # unit: m     # 大于此距离为关键帧
  key_frame_angle: 0.2      # unit: rad   # 大于此角度为关键帧
  loopSearchDistance: 3
  loopSearchTimeDiff: 30  # unit: sec, 原本30s, 
  loopSearchSkipKey: 5  # 跳过的关键帧数， 间隔帧数小于 loopSearchSkipKey ，不参与回环检测搜索
  loopIcpScore: 0.3 # 原本代码中写死为 0.3
  # use_ele_pcd_flag: false   # 是否使用单区域pcd
  # save_ele_pcd_flag: false  # 是否保存单区域pcd
  save_map_resolution: 0.1 # unit: m

re_localization:
  score_thr: 0.05
  time_out_thr: 120 # unit: second, 超过 time_out_thr，还未重定位成功，认为重定位失败

ikdtree:
  cube_len: 400.0
  det_range: 40.0
  kdTreeReconstructRadius: 400.0
  kdTreeReconstructKeyFrameLeafSize: 10.0
  kdTreeReconstructPointLeafSize: 1.0
  map_leaf_size: 0.5  # ???为什么在这里  
  
detect_slip: 
  detect_window_time_range: 2 # unit: second
  slipping_count_thr: 5 # 连续帧数超过距离阈值，即为打滑
  slipping_dist_thr: 0.2 # unit: m